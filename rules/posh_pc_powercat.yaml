# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Netcat The Powershell Version"
description: "Adversaries may use a non-application layer protocol for communication between host and C2 server or among infected hosts within a network"
severity: Medium
query_text: |
  (((Event.EventData.Data:"powercat " or Event.EventData.Data:"powercat.ps1")))
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.command-and-control"
  - "attack.execution"
  - "attack.t1095"
  - "attack.t1059.001"

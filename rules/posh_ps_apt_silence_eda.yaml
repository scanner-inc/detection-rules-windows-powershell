# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Silence.EDA Detection"
description: "Detects Silence EmpireDNSAgent as described in the Group-IP report"
severity: Critical
query_text: |
  (((Event.EventData.ScriptBlockText:"System.Diagnostics.Process" and Event.EventData.ScriptBlockText:"Stop-Computer" and Event.EventData.ScriptBlockText:"Restart-Computer" and Event.EventData.ScriptBlockText:"Exception in execution" and Event.EventData.ScriptBlockText:"$cmdargs" and Event.EventData.ScriptBlockText:"Close-Dnscat2Tunnel")) and ((Event.EventData.ScriptBlockText:"set type=$LookupType`nserver" and Event.EventData.ScriptBlockText:"$Command | nslookup 2>&1 | Out-String" and Event.EventData.ScriptBlockText:"New-RandomDNSField" and Event.EventData.ScriptBlockText:"[Convert]::ToString($SYNOptions, 16)" and Event.EventData.ScriptBlockText:"$Session.Dead = $True" and Event.EventData.ScriptBlockText:"$Session[\"Driver\"] -eq")))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.ScriptBlockText, Event.EventData.ScriptBlockId, Event.EventData.Path)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "critical_severity_alerts"
tags:
  - "attack.execution"
  - "attack.t1059.001"
  - "attack.command-and-control"
  - "attack.t1071.004"
  - "attack.t1572"
  - "attack.impact"
  - "attack.t1529"
  - "attack.g0091"
  - "attack.s0363"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Path": "", "Event.EventData.ScriptBlockId": "5f1a1a3e-88b0-4e63-9f0b-6f2c2b0a1234", "Event.EventData.ScriptBlockText": "System.Diagnostics.Process; Stop-Computer; Restart-Computer; Exception in execution; $cmdargs; Close-Dnscat2Tunnel; set type=$LookupType`nserver; $Command | nslookup 2>&1 | Out-String; New-RandomDNSField; [Convert]::ToString($SYNOptions, 16); $Session.Dead = $True; $Session[\"Driver\"] -eq", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4104", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Path": "", "Event.EventData.ScriptBlockId": "5f1a1a3e-88b0-4e63-9f0b-6f2c2b0a1234", "Event.EventData.ScriptBlockText": "Get-ChildItem -Path C:\\\\Users\\\\jdoe\\\\Documents | Sort-Object LastWriteTime | Select-Object -First 10", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4104", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

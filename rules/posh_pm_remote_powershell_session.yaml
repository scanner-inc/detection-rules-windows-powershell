# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Remote PowerShell Session (PS Module)"
description: "Detects remote PowerShell sessions"
severity: High
query_text: |
  (((Event.EventData.ContextInfo:" = ServerRemoteHost " and Event.EventData.ContextInfo:"wsmprovhost.exe")) and not (Event.EventData.ContextInfo:"\\Windows\\system32\\WindowsPowerShell\\v1.0\\Modules\\Microsoft.PowerShell.Archive\\Microsoft.PowerShell.Archive.psm1"))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.execution"
  - "attack.t1059.001"
  - "attack.lateral-movement"
  - "attack.t1021.006"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.ContextInfo": " = ServerRemoteHost ; wsmprovhost.exe", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.ContextInfo": "CommandInvocation(Get-ChildItem): \"Get-ChildItem\" ParameterBinding(Get-ChildItem): name=\"Path\"; value=\"C:\\\\Users\\\\jdoe\\\\Documents\"", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

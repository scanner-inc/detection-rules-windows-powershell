# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "PowerShell Get Clipboard"
description: "A General detection for the Get-Clipboard commands in PowerShell logs. This could be an adversary capturing clipboard contents."
severity: Medium
query_text: |
  ((Event.EventData.Payload:"Get-Clipboard"))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.collection"
  - "attack.t1115"

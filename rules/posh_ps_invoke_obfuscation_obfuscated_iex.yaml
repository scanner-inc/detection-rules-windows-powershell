# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell"
description: "Detects all variations of obfuscated powershell IEX invocation code generated by Invoke-Obfuscation framework from the following code block \\u2014"
severity: High
query_text: |
  (Event.EventData.ScriptBlockText:"$ShellId[" and Event.EventData.ScriptBlockText:"+ $ShellId[")
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.stealth"
  - "attack.t1027"
  - "attack.execution"
  - "attack.t1059.001"

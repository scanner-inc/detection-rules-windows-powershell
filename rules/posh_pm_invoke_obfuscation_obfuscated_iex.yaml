# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module"
description: "Detects all variations of obfuscated powershell IEX invocation code generated by Invoke-Obfuscation framework from the code block cited in the reference section below"
severity: High
query_text: |
  (Event.EventData.Payload:"$PSHome[" and Event.EventData.Payload:"+ $PSHome[")
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.stealth"
  - "attack.t1027"
  - "attack.execution"
  - "attack.t1059.001"

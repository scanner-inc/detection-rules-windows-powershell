# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "PowerShell Decompress Commands"
description: "A General detection for specific decompress commands in PowerShell logs. This could be an adversary decompressing files."
severity: Medium
query_text: |
  ((Event.EventData.Payload:"Expand-Archive"))
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.stealth"
  - "attack.t1140"

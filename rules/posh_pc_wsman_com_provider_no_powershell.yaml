# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Suspicious Non PowerShell WSMAN COM Provider"
description: "Detects suspicious use of the WSMAN provider without PowerShell.exe as the host application."
severity: Medium
query_text: |
  Event.System.Channel='Windows PowerShell' and ((Event.EventData.Data:'ProviderName=WSMan') and not ((Event.EventData.Data:('HostApplication=powershell' 'HostApplication=C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell' 'HostApplication=C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell' 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell' 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'))) and not (Event.EventData.Data:'HostApplication=C:\\Hexnode\\Hexnode Agent\\Current\\HexnodeAgent.exe'))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Data)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.execution"
  - "attack.t1059.001"
  - "attack.lateral-movement"
  - "attack.t1021.003"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "ProviderName=WSMan", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on a case-variant of the matching event (matching is case-insensitive)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "PROVIDERNAME=WSMAN", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert when the rule's exclusion applies (exclusion is case-insensitive)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "PROVIDERNAME=WSMAN; HOSTAPPLICATION=C:\\WINDOWS\\SYSTEM32\\WINDOWSPOWERSHELL\\V1.0\\POWERSHELL", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert when the same content appears in a different channel (e.g. a Sysmon process-create event)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "ProviderName=WSMan", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostApplication=powershell.exe -Command \"Get-ChildItem C:\\\\Users\\\\jdoe\\\\Documents\" EngineVersion=5.1.19041.1 HostVersion=5.1.19041.1 HostName=ConsoleHost", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

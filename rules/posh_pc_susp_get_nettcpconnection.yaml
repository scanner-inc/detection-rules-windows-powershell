# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Use Get-NetTCPConnection"
description: "Adversaries may attempt to get a listing of network connections to or from the compromised system they are currently accessing or from remote systems by querying for information over the network."
severity: Low
query_text: |
  Event.System.Channel='Windows PowerShell' and ((Event.EventData.Data:'Get-NetTCPConnection'))
  | stats count() as query_count by Event.System.Computer, Event.System.Security.UserID
  | where(query_count > 4)
time_range_s: 1800
run_frequency_s: 1800
event_sink_keys:
  - "low_severity_alerts"
tags:
  - "attack.discovery"
  - "attack.t1049"
tests:
  - name: "Alerts when the same user/host repeats the activity more than 4 times within the lookback window"
    now_timestamp: "2026-09-22T00:30:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:20:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:22:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:24:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:26:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:28:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on case-variant events exceeding the 4-occurrence threshold (matching is case-insensitive)"
    now_timestamp: "2026-09-22T00:30:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:20:00.000Z", "Event.EventData.Data": "GET-NETTCPCONNECTION", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:22:00.000Z", "Event.EventData.Data": "GET-NETTCPCONNECTION", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:24:00.000Z", "Event.EventData.Data": "GET-NETTCPCONNECTION", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:26:00.000Z", "Event.EventData.Data": "GET-NETTCPCONNECTION", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:28:00.000Z", "Event.EventData.Data": "GET-NETTCPCONNECTION", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert when the count stays at the 4-occurrence threshold (not exceeding it)"
    now_timestamp: "2026-09-22T00:30:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:22:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:24:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:26:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:28:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert when the same content appears in a different channel (e.g. Sysmon) more than 4 times"
    now_timestamp: "2026-09-22T00:30:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:20:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:22:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:24:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:26:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
      {"@scnr.datetime": "2026-09-22T00:28:00.000Z", "Event.EventData.Data": "Get-NetTCPConnection", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "PowerShell Get-Process LSASS in ScriptBlock"
description: "Detects a Get-Process command on lsass process, which is in almost all cases a sign of malicious activity"
severity: High
query_text: |
  ((Event.EventData.ScriptBlockText:"Get-Process lsass"))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.ScriptBlockText, Event.EventData.ScriptBlockId, Event.EventData.Path)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.credential-access"
  - "attack.t1003.001"

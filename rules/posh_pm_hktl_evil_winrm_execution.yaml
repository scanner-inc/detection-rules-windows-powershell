# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "HackTool - Evil-WinRm Execution - PowerShell Module"
description: "Detects the execution of Evil-WinRM via PowerShell Module logs by leveraging the hardcoded strings inside the utility."
severity: High
query_text: |
  (((Event.EventData.ContextInfo:(":\\Windows\\System32\\wsmprovhost.exe" ":\\Windows\\SysWOW64\\wsmprovhost.exe"))) and ((Event.EventData.Payload:("value=\"(get-location).path" "value=\"(get-item*).length" "Invoke-Binary " "Donut-Loader -process_id*-donutfile" "Bypass-4MSI" "IEX ([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($a))).replace('???','')")) or (Event.EventData.Payload:"$servicios = Get-ItemProperty \"registry::HKLM\\System\\CurrentControlSet\\Services\\\"" and Event.EventData.Payload:"Where-Object {$_.imagepath -notmatch \"system\" -and $_.imagepath -ne $null } | Select-Object pschildname,imagepath") or (Event.EventData.Payload:"$a +=  \\\"$($_.FullName.Replace('\\\\','/'))/\\\"}else{  $a += \\\"$($_.FullName.Replace('\\\\', '/'))\\\" }" and Event.EventData.Payload:"$a=@();$")))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.lateral-movement"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.ContextInfo": ":\\Windows\\System32\\wsmprovhost.exe", "Event.EventData.Payload": "value=\"(get-location).path", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.ContextInfo": "CommandInvocation(Get-ChildItem): \"Get-ChildItem\" ParameterBinding(Get-ChildItem): name=\"Path\"; value=\"C:\\\\Users\\\\jdoe\\\\Documents\"", "Event.EventData.Payload": "Get-ChildItem -Path C:\\\\Users\\\\jdoe\\\\Documents | Sort-Object LastWriteTime", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Renamed Powershell Under Powershell Channel"
description: "Detects a renamed Powershell execution, which is a common technique used to circumvent security controls and bypass detection logic that's dependent on process names and process paths."
severity: Low
query_text: |
  Event.System.Channel='Windows PowerShell' and ((Event.EventData.Data:'HostName=ConsoleHost') and not ((Event.EventData.Data:('HostApplication=powershell' 'HostApplication=C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell' 'HostApplication=C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell' 'HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell' 'HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell'))))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Data)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "low_severity_alerts"
tags:
  - "attack.execution"
  - "attack.stealth"
  - "attack.t1059.001"
  - "attack.t1036.003"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostName=ConsoleHost", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on a case-variant of the matching event (matching is case-insensitive)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HOSTNAME=CONSOLEHOST", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert when the rule's exclusion applies (exclusion is case-insensitive)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HOSTNAME=CONSOLEHOST; HOSTAPPLICATION=C:\\WINDOWS\\SYSTEM32\\WINDOWSPOWERSHELL\\V1.0\\POWERSHELL", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert when the same content appears in a different channel (e.g. a Sysmon process-create event)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostName=ConsoleHost", "Event.System.Channel": "Microsoft-Windows-Sysmon/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "1", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostApplication=powershell.exe -Command \"Get-ChildItem C:\\\\Users\\\\jdoe\\\\Documents\" EngineVersion=5.1.19041.1 HostVersion=5.1.19041.1 HostName=ConsoleHost", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

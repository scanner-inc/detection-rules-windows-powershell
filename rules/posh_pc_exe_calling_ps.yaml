# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "PowerShell Called from an Executable Version Mismatch"
description: "Detects PowerShell called from an executable by the version mismatch method"
severity: High
query_text: |
  (((Event.EventData.Data:"EngineVersion=2." or Event.EventData.Data:"EngineVersion=4." or Event.EventData.Data:"EngineVersion=5.") and Event.EventData.Data:"HostVersion=3."))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Data)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.execution"
  - "attack.t1059.001"

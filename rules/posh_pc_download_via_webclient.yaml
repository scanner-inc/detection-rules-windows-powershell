# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "PowerShell Download Via Net.WebClient - PowerShell Classic"
description: "Detects PowerShell download activity, via the .DownloadFile() or .DownloadString() methods of the Net.WebClient class.\nThis technique is often abused by attackers to download additional payloads."
severity: Low
query_text: |
  (((Event.EventData.Data:(".DownloadFile(" ".DownloadString(")) and Event.EventData.Data:"Net.WebClient"))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Data)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "low_severity_alerts"
tags:
  - "attack.execution"
  - "attack.command-and-control"
  - "attack.t1059.001"
  - "attack.t1105"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": ".DownloadFile(; Net.WebClient", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostApplication=powershell.exe -Command \"Get-ChildItem C:\\\\Users\\\\jdoe\\\\Documents\" EngineVersion=5.1.19041.1 HostVersion=5.1.19041.1 HostName=ConsoleHost", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

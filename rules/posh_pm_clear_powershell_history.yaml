# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Clear PowerShell History - PowerShell Module"
description: "Detects keywords that could indicate clearing PowerShell history"
severity: Medium
query_text: |
  (((Event.EventData.Payload:"Set-PSReadlineOption" and Event.EventData.Payload:"–HistorySaveStyle" and Event.EventData.Payload:SaveNothing) or (Event.EventData.Payload:"Set-PSReadlineOption" and Event.EventData.Payload:"-HistorySaveStyle" and Event.EventData.Payload:SaveNothing)) or ((Event.EventData.Payload:(del "Remove-Item" rm)) and Event.EventData.Payload:"(Get-PSReadlineOption).HistorySavePath"))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.stealth"
  - "attack.t1070.003"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "Set-PSReadlineOption; –HistorySaveStyle; SaveNothing", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "Get-ChildItem -Path C:\\\\Users\\\\jdoe\\\\Documents | Sort-Object LastWriteTime", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

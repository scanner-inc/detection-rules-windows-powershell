# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Dump Credentials from Windows Credential Manager With PowerShell"
description: "Adversaries may search for common password storage locations to obtain user credentials.\nPasswords are stored in several places on a system, depending on the operating system or application holding the credentials."
severity: Medium
query_text: |
  (((Event.EventData.ScriptBlockText:"Get-PasswordVaultCredentials" or Event.EventData.ScriptBlockText:"Get-CredManCreds") or (Event.EventData.ScriptBlockText:"New-Object" and Event.EventData.ScriptBlockText:"Windows.Security.Credentials.PasswordVault") or (Event.EventData.ScriptBlockText:"New-Object" and Event.EventData.ScriptBlockText:"Microsoft.CSharp.CSharpCodeProvider" and Event.EventData.ScriptBlockText:"[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())" and Event.EventData.ScriptBlockText:"Collections.ArrayList" and Event.EventData.ScriptBlockText:"System.CodeDom.Compiler.CompilerParameters")))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.ScriptBlockText, Event.EventData.ScriptBlockId, Event.EventData.Path)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.credential-access"
  - "attack.t1555"

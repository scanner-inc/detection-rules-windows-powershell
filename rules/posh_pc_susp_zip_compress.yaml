# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Zip A Folder With PowerShell For Staging In Temp - PowerShell"
description: "Detects PowerShell scripts that make use of the \"Compress-Archive\" Cmdlet in order to compress folders and files where the output is stored in a potentially suspicious location that is used often by malware for exfiltration.\nAn adversary might compress data (e.g., sensitive documents) that is collected prior to exfiltration in order to make it portable and minimize the amount of data sent over the network."
severity: Medium
query_text: |
  (((Event.EventData.Data:("Compress-Archive -Path*-DestinationPath $env:TEMP" "Compress-Archive -Path*-DestinationPath*\\AppData\\Local\\Temp\\" "Compress-Archive -Path*-DestinationPath*:\\Windows\\Temp\\"))))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Data)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.collection"
  - "attack.t1074.001"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "Compress-Archive -Path*-DestinationPath $env:TEMP", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Data": "HostApplication=powershell.exe -Command \"Get-ChildItem C:\\\\Users\\\\jdoe\\\\Documents\" EngineVersion=5.1.19041.1 HostVersion=5.1.19041.1 HostName=ConsoleHost", "Event.System.Channel": "Windows PowerShell", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "800", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Dump Credentials from Windows Credential Manager With PowerShell"
description: "Adversaries may search for common password storage locations to obtain user credentials.\nPasswords are stored in several places on a system, depending on the operating system or application holding the credentials."
severity: Medium
query_text: |
  (((Event.EventData.ScriptBlockText:("Get-PasswordVaultCredentials" "Get-CredManCreds")) or (Event.EventData.ScriptBlockText:"New-Object" and Event.EventData.ScriptBlockText:"Windows.Security.Credentials.PasswordVault") or (Event.EventData.ScriptBlockText:"New-Object" and Event.EventData.ScriptBlockText:"Microsoft.CSharp.CSharpCodeProvider" and Event.EventData.ScriptBlockText:"[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())" and Event.EventData.ScriptBlockText:"Collections.ArrayList" and Event.EventData.ScriptBlockText:"System.CodeDom.Compiler.CompilerParameters")))
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.ScriptBlockText, Event.EventData.ScriptBlockId, Event.EventData.Path)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "medium_severity_alerts"
tags:
  - "attack.credential-access"
  - "attack.t1555"
tests:
  - name: "Alerts on a matching event"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Path": "", "Event.EventData.ScriptBlockId": "5f1a1a3e-88b0-4e63-9f0b-6f2c2b0a1234", "Event.EventData.ScriptBlockText": "Get-PasswordVaultCredentials", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4104", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Path": "", "Event.EventData.ScriptBlockId": "5f1a1a3e-88b0-4e63-9f0b-6f2c2b0a1234", "Event.EventData.ScriptBlockText": "Get-ChildItem -Path C:\\\\Users\\\\jdoe\\\\Documents | Sort-Object LastWriteTime | Select-Object -First 10", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4104", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

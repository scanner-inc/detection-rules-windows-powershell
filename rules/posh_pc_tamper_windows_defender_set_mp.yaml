# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Tamper Windows Defender - PSClassic"
description: "Attempting to disable scheduled scanning and other parts of Windows Defender ATP or set default actions to allow."
severity: High
query_text: |
  ((Event.EventData.Data:"Set-MpPreference") and ((Event.EventData.Data:"HighThreatDefaultAction Allow" or Event.EventData.Data:"htdefac Allow" or Event.EventData.Data:"LowThreatDefaultAction Allow" or Event.EventData.Data:"ltdefac Allow" or Event.EventData.Data:"ModerateThreatDefaultAction Allow" or Event.EventData.Data:"mtdefac Allow" or Event.EventData.Data:"SevereThreatDefaultAction Allow" or Event.EventData.Data:"stdefac Allow") or (Event.EventData.Data:"-dbaf $true" or Event.EventData.Data:"-dbaf 1" or Event.EventData.Data:"-dbm $true" or Event.EventData.Data:"-dbm 1" or Event.EventData.Data:"-dips $true" or Event.EventData.Data:"-dips 1" or Event.EventData.Data:"-DisableArchiveScanning $true" or Event.EventData.Data:"-DisableArchiveScanning 1" or Event.EventData.Data:"-DisableBehaviorMonitoring $true" or Event.EventData.Data:"-DisableBehaviorMonitoring 1" or Event.EventData.Data:"-DisableBlockAtFirstSeen $true" or Event.EventData.Data:"-DisableBlockAtFirstSeen 1" or Event.EventData.Data:"-DisableCatchupFullScan $true" or Event.EventData.Data:"-DisableCatchupFullScan 1" or Event.EventData.Data:"-DisableCatchupQuickScan $true" or Event.EventData.Data:"-DisableCatchupQuickScan 1" or Event.EventData.Data:"-DisableIntrusionPreventionSystem $true" or Event.EventData.Data:"-DisableIntrusionPreventionSystem 1" or Event.EventData.Data:"-DisableIOAVProtection $true" or Event.EventData.Data:"-DisableIOAVProtection 1" or Event.EventData.Data:"-DisableRealtimeMonitoring $true" or Event.EventData.Data:"-DisableRealtimeMonitoring 1" or Event.EventData.Data:"-DisableRemovableDriveScanning $true" or Event.EventData.Data:"-DisableRemovableDriveScanning 1" or Event.EventData.Data:"-DisableScanningMappedNetworkDrivesForFullScan $true" or Event.EventData.Data:"-DisableScanningMappedNetworkDrivesForFullScan 1" or Event.EventData.Data:"-DisableScanningNetworkFiles $true" or Event.EventData.Data:"-DisableScanningNetworkFiles 1" or Event.EventData.Data:"-DisableScriptScanning $true" or Event.EventData.Data:"-DisableScriptScanning 1" or Event.EventData.Data:"-MAPSReporting $false" or Event.EventData.Data:"-MAPSReporting 0" or Event.EventData.Data:"-drdsc $true" or Event.EventData.Data:"-drdsc 1" or Event.EventData.Data:"-drtm $true" or Event.EventData.Data:"-drtm 1" or Event.EventData.Data:"-dscrptsc $true" or Event.EventData.Data:"-dscrptsc 1" or Event.EventData.Data:"-dsmndf $true" or Event.EventData.Data:"-dsmndf 1" or Event.EventData.Data:"-dsnf $true" or Event.EventData.Data:"-dsnf 1" or Event.EventData.Data:"-dss $true" or Event.EventData.Data:"-dss 1")))
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.defense-impairment"
  - "attack.t1685"

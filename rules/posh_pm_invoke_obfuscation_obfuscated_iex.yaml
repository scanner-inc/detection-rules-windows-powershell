# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module"
description: "Detects obfuscated PowerShell IEX invocation generated by Invoke-Obfuscation: indexed character lookups into $PSHome, $ShellId, $env:Public or $env:ComSpec, the *mdr* member-name lookup, and $VerbosePreference string conversion. Port of the Sigma regexes using wildcard approximations (no numeric-index validation)."
severity: High
query_text: |
  Event.EventData.Payload:('$PSHome[*]*+*$PSHome[' '$ShellId[*]*+*$ShellId[' '$env:Public[*]*+*$env:Public[' '$env:ComSpec[*,*,' '\*mdr\**).Name' '$VerbosePreference.ToString(' '[String]$VerbosePreference' '[String] $VerbosePreference')
  | table(Event.System.TimeCreated.SystemTime, Event.System.Computer, Event.System.Security.UserID, Event.System.EventID, Event.EventData.Payload, Event.EventData.ContextInfo)
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.stealth"
  - "attack.t1027"
  - "attack.execution"
  - "attack.t1059.001"
tests:
  - name: "Alerts on $PSHome indexed IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($PSHome[4]+$PSHome[30]+'x') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on $ShellId indexed IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($ShellId[1]+$ShellId[13]+'x') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on $env:Public indexed IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($env:Public[13]+$env:Public[5]+'x') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on $env:ComSpec multi-index IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($env:ComSpec[4,15,25]-Join'') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on *mdr* member-name IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".((gv '*mdr*').Name[3,11,2]-Join'') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on $VerbosePreference.ToString IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($VerbosePreference.ToString()[1,3]+'x'-Join'') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on [String]$VerbosePreference IEX obfuscation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".(([String]$VerbosePreference)[1,3]+'x'-Join'') 'Write-Host hi'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Alerts on a case-variant of the matching event (matching is case-insensitive)"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": ".($PSHOME[4]+$PSHOME[30]+'X') 'WRITE-HOST HI'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: true
  - name: "Does not alert on a single $PSHome index without the paired concatenation"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "Write-Host $PSHome[0]", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert on two $PSHome index lookups with no concatenation between them"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "Write-Host $PSHome[0]; Write-Host $PSHome[1]", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert on legitimate $PSHome and $env:ComSpec usage"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "& $PSHome\\powershell.exe -NoProfile; & $env:ComSpec /c dir; $VerbosePreference = 'Continue'", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false
  - name: "Does not alert on unrelated benign PowerShell activity"
    now_timestamp: "2026-09-22T00:10:00.000Z"
    dataset_inline: |
      {"@scnr.datetime": "2026-09-22T00:08:00.000Z", "Event.EventData.Payload": "Get-ChildItem -Path C:\\\\Users\\\\jdoe\\\\Documents | Sort-Object LastWriteTime", "Event.System.Channel": "Microsoft-Windows-PowerShell/Operational", "Event.System.Computer": "WKS-ENG-221.corp.scanner.dev", "Event.System.EventID": "4103", "Event.System.Security.UserID": "S-1-5-21-1111111111-2222222222-3333333333-1105"}
    expected_detection_result: false

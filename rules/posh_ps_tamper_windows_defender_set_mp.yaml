# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Tamper Windows Defender - ScriptBlockLogging"
description: "Detects PowerShell scripts attempting to disable scheduled scanning and other parts of Windows Defender ATP or set default actions to allow."
severity: High
query_text: |
  (((Event.EventData.ScriptBlockText:"-dbaf $true" or Event.EventData.ScriptBlockText:"-dbaf 1" or Event.EventData.ScriptBlockText:"-dbm $true" or Event.EventData.ScriptBlockText:"-dbm 1" or Event.EventData.ScriptBlockText:"-dips $true" or Event.EventData.ScriptBlockText:"-dips 1" or Event.EventData.ScriptBlockText:"-DisableArchiveScanning $true" or Event.EventData.ScriptBlockText:"-DisableArchiveScanning 1" or Event.EventData.ScriptBlockText:"-DisableBehaviorMonitoring $true" or Event.EventData.ScriptBlockText:"-DisableBehaviorMonitoring 1" or Event.EventData.ScriptBlockText:"-DisableBlockAtFirstSeen $true" or Event.EventData.ScriptBlockText:"-DisableBlockAtFirstSeen 1" or Event.EventData.ScriptBlockText:"-DisableCatchupFullScan $true" or Event.EventData.ScriptBlockText:"-DisableCatchupFullScan 1" or Event.EventData.ScriptBlockText:"-DisableCatchupQuickScan $true" or Event.EventData.ScriptBlockText:"-DisableCatchupQuickScan 1" or Event.EventData.ScriptBlockText:"-DisableIntrusionPreventionSystem $true" or Event.EventData.ScriptBlockText:"-DisableIntrusionPreventionSystem 1" or Event.EventData.ScriptBlockText:"-DisableIOAVProtection $true" or Event.EventData.ScriptBlockText:"-DisableIOAVProtection 1" or Event.EventData.ScriptBlockText:"-DisableRealtimeMonitoring $true" or Event.EventData.ScriptBlockText:"-DisableRealtimeMonitoring 1" or Event.EventData.ScriptBlockText:"-DisableRemovableDriveScanning $true" or Event.EventData.ScriptBlockText:"-DisableRemovableDriveScanning 1" or Event.EventData.ScriptBlockText:"-DisableScanningMappedNetworkDrivesForFullScan $true" or Event.EventData.ScriptBlockText:"-DisableScanningMappedNetworkDrivesForFullScan 1" or Event.EventData.ScriptBlockText:"-DisableScanningNetworkFiles $true" or Event.EventData.ScriptBlockText:"-DisableScanningNetworkFiles 1" or Event.EventData.ScriptBlockText:"-DisableScriptScanning $true" or Event.EventData.ScriptBlockText:"-DisableScriptScanning 1" or Event.EventData.ScriptBlockText:"-MAPSReporting $false" or Event.EventData.ScriptBlockText:"-MAPSReporting 0" or Event.EventData.ScriptBlockText:"-drdsc $true" or Event.EventData.ScriptBlockText:"-drdsc 1" or Event.EventData.ScriptBlockText:"-drtm $true" or Event.EventData.ScriptBlockText:"-drtm 1" or Event.EventData.ScriptBlockText:"-dscrptsc $true" or Event.EventData.ScriptBlockText:"-dscrptsc 1" or Event.EventData.ScriptBlockText:"-dsmndf $true" or Event.EventData.ScriptBlockText:"-dsmndf 1" or Event.EventData.ScriptBlockText:"-dsnf $true" or Event.EventData.ScriptBlockText:"-dsnf 1" or Event.EventData.ScriptBlockText:"-dss $true" or Event.EventData.ScriptBlockText:"-dss 1") and Event.EventData.ScriptBlockText:"Set-MpPreference") or (Event.EventData.ScriptBlockText:"Set-MpPreference" and (Event.EventData.ScriptBlockText:"HighThreatDefaultAction Allow" or Event.EventData.ScriptBlockText:"htdefac Allow" or Event.EventData.ScriptBlockText:"LowThreatDefaultAction Allow" or Event.EventData.ScriptBlockText:"ltdefac Allow" or Event.EventData.ScriptBlockText:"ModerateThreatDefaultAction Allow" or Event.EventData.ScriptBlockText:"mtdefac Allow" or Event.EventData.ScriptBlockText:"SevereThreatDefaultAction Allow" or Event.EventData.ScriptBlockText:"stdefac Allow")))
time_range_s: 600
run_frequency_s: 300
event_sink_keys:
  - "high_severity_alerts"
tags:
  - "attack.defense-impairment"
  - "attack.t1685"
